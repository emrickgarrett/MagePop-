# Builds the desktop game for Windows, macOS and Linux and attaches the installers to a
# DRAFT GitHub release. Trigger it by pushing a version tag (patch, minor or major):
#
#   1. git tag v0.2.1 && git push origin v0.2.1
#   2. review the draft on the Releases page, add notes, click Publish
#
# The tag IS the version: the build stamps it into the app, so package.json doesn't need bumping.
# (Publishing the draft is what makes the in-game updater offer it to players.)
#
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Use the tag as the app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' isn't a version like v1.2.3"
            exit 1
          fi
          npm pkg set version="$VERSION" --workspace @magepop/desktop
          echo "Building MagePop $VERSION"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build and publish installers
        run: npm run release -w @magepop/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Browser version for itch.io ("play in browser"). Skipped until the repo has a BUTLER_API_KEY
  # secret (itch.io → Settings → API keys) and an ITCH_GAME variable like "yourname/magepop"
  # (repo Settings → Secrets and variables → Actions). The key never goes in the repo.
  itch-web:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != '' && env.ITCH_GAME != ''

      - uses: actions/setup-node@v4
        if: env.BUTLER_API_KEY != '' && env.ITCH_GAME != ''
        with:
          node-version: 26

      - name: Build the browser version
        if: env.BUTLER_API_KEY != '' && env.ITCH_GAME != ''
        run: |
          npm install
          npm test
          VITE_WEB_VERSION="${GITHUB_REF_NAME#v}" npm run build -w @magepop/client

      - name: Upload to itch.io with butler
        if: env.BUTLER_API_KEY != '' && env.ITCH_GAME != ''
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push packages/client/dist "$ITCH_GAME:html5" --userversion "${GITHUB_REF_NAME#v}"
