# Tests and deploys the PVP server to Fly.io when server or engine code changes on main.
# Needs one repository secret: FLY_API_TOKEN (Fly dashboard -> Tokens -> create a deploy token).
# Without it, the tests still run and the deploy step is skipped.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/server/**'
      - 'fly.toml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install
        run: npm ci --workspace @magepop/core --workspace @magepop/server --ignore-scripts

      - name: Test engine and server
        run: npm run test -w @magepop/core -w @magepop/server

      # Pinned to a commit (flyctl-actions 1.6) rather than a moving tag.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: env.FLY_API_TOKEN != ''

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
